version: "4.1"
name: F407ZGT6_V3
type: ARM
deviceName: null
packDir: null
srcDirs:
  - BSP
  - Core
  - Drivers
  - APP
  - SVC
  - Middlewares
  - FATFS
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: startup
      files:
        - path: startup_stm32f407xx.s
      folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: c85adb6ad8b7eb054388e6b373d64444
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - USE_HAL_DRIVER
        - STM32F407xx
        - LV_CONF_INCLUDE_SIMPLE
      incList:
        - Core/Inc
        - Drivers/CMSIS/Include
        - Drivers/CMSIS/Device/ST/STM32F4xx/Include
        - Drivers/STM32F4xx_HAL_Driver/Inc
        - Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
        - BSP/at24cxx
        - BSP/key
        - BSP/lcd
        - BSP/led
        - BSP/touch
        - BSP/w25qxx
        - Middlewares/Third_Party/FreeRTOS/Source/include
        - Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
        - Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
        - APP/key
        - APP/lcd
        - APP/led
        - APP/lvgl
        - APP/touch
        - APP/uart
        - SVC/ymodem
        - Middlewares/LVGL
        - Middlewares/LVGL/lvgl
        - Middlewares/LVGL/lvgl/include
        - Middlewares/LVGL/lvgl/demos/widgets
        - SVC/fs
        - FATFS/App
        - FATFS/Target
        - Middlewares/Third_Party/FatFs/src
      libList: []
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-2
            warnings: all-warnings
          global:
            $float-abi-type: hard
            arm-thumb-mode: thumb
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes:
              - .bin
            $toolName: auto
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32F407xx_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
      STLink:
        address: "0x08000000"
        bin: ""
        elFile: None
        optionBytes: .eide/debug.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
    uploader: STLink
